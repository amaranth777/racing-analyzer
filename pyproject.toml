[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racing-analyzer"
version = "0.1.0"
description = "RacingAnalyzer GT7 telemetry analysis tools"
requires-python = ">=3.11"

[project.scripts]
gt7 = "gt7coach.cli:main"
racing-analyzer = "gt7coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
